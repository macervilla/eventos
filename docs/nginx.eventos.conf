# Pegar DENTRO del server HTTPS de acersistemas.site.
# Reemplazar los dos bloques /eventos anteriores; no duplicarlos.
location = /eventos {
    return 301 /eventos/;
}

location /eventos/api/ {
    proxy_pass http://127.0.0.1:8009/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
}

# Callback privado de MediaMTX. Solo se usa dentro de la red de Docker.
location ^~ /eventos/api/interno/ {
    return 404;
}

# Senalizacion WHIP/WHEP exclusivamente. El video viaja por ICE/DTLS, no por FastAPI.
location ^~ /eventos/rtc/ {
    absolute_redirect off;
    if ($uri !~ "^/eventos/rtc/evt-[0-9]+-[a-f0-9]{32}/(whip|whep)(/[a-f0-9-]{36})?$") { return 404; }
    proxy_pass http://127.0.0.1:8889/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect ~^(/.*)$ /eventos/rtc$1;
    proxy_buffering off;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
    access_log off;
}

# Los archivos inexistentes deben devolver 404, nunca el HTML de la SPA.
location ^~ /eventos/assets/ {
    alias /var/www/eventos/frontend/dist/assets/;
}

# La aplicacion actual guarda las imagenes con URLs /media/.
# Este prefijo debe estar disponible para Eventos en este dominio.
location /media/ {
    proxy_pass http://127.0.0.1:8009/media/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Los enlaces publicos generados por el backend usan tambien este prefijo.
location /eventos/media/ {
    proxy_pass http://127.0.0.1:8009/media/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# URLs publicas definitivas: /eventos/{slug} (React resuelve evento/proveedor).
# No agregar locations ni redirecciones para los antiguos prefijos p/ y e/.
location /eventos/ {
    alias /var/www/eventos/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /eventos/index.html;
    # El HTML debe cargar siempre los assets de la ultima publicacion.
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
