# Pegar DENTRO del server HTTPS de acersistemas.site.
# Reemplazar los dos bloques /eventos anteriores; no duplicarlos.
location = /eventos {
    return 301 /eventos/;
}

location /eventos/api/ {
    proxy_pass http://127.0.0.1:8009/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
}

# Los archivos inexistentes deben devolver 404, nunca el HTML de la SPA.
location ^~ /eventos/assets/ {
    alias /var/www/eventos/frontend/dist/assets/;
}

# La aplicacion actual guarda las imagenes con URLs /media/.
# Este prefijo debe estar disponible para Eventos en este dominio.
location /media/ {
    proxy_pass http://127.0.0.1:8009/media/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Los enlaces publicos generados por el backend usan tambien este prefijo.
location /eventos/media/ {
    proxy_pass http://127.0.0.1:8009/media/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /eventos/ {
    alias /var/www/eventos/frontend/dist/;
    index index.html;
    try_files $uri $uri/ /eventos/index.html;
    # El HTML debe cargar siempre los assets de la ultima publicacion.
    etag off;
    if_modified_since off;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
